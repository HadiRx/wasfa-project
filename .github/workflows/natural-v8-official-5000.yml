name: Natural-20 V8 Official 5000

on:
  workflow_dispatch:
  push:
    branches: [controls-challenge-compute]
    paths:
      - .github/workflows/natural-v8-official-5000.yml

permissions:
  contents: write

concurrency:
  group: natural-v8-official-5000
  cancel-in-progress: true

jobs:
  official-5000:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Checkout stock challenge
        run: git clone --depth 1 https://github.com/commaai/controls_challenge.git official

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install official runtime
        run: python -m pip install --upgrade pip pandas numpy onnxruntime matplotlib seaborn tqdm lxml

      - name: Download official dataset
        working-directory: official
        run: python -c "from tinyphysics import download_dataset; download_dataset()"

      - name: Record immutable inputs
        run: |
          mkdir -p checkpoints/official5000-v8
          git -C official rev-parse HEAD > checkpoints/official5000-v8/official-challenge-commit.txt
          git rev-parse HEAD > checkpoints/official5000-v8/controller-repository-commit.txt
          find official/data -maxdepth 1 -type f -name '*.csv' | sort | sha256sum > checkpoints/official5000-v8/dataset-file-list.sha256

      - name: Train reproducible route-agnostic inverse model
        run: |
          python -u compute/train_warmup_inverse.py \
            --data-dir official/data \
            --train-start 0 --train-count 5000 \
            --validation-start 10000 --validation-count 500 \
            --output official/models/riyadh_inverse_linear.npz

      - name: Run controller tests
        run: python -m unittest discover -s tests -v

      - name: Package V8 controller for stock evaluator
        run: |
          cp compute/riyadh_general.py official/controllers/riyadh_general.py
          rm -f official/models/riyadh_general_policy.npz

      - name: Run exact official 5000-segment evaluation
        working-directory: official
        run: |
          python -u eval.py \
            --model_path ./models/tinyphysics.onnx \
            --data_path ./data \
            --num_segs 5000 \
            --test_controller riyadh_general \
            --baseline_controller pid \
            | tee ../checkpoints/official5000-v8/eval-stdout.log

      - name: Extract and verify official aggregate table
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import pandas as pd

          report = Path("official/report.html")
          if not report.is_file() or report.stat().st_size == 0:
            raise SystemExit("official report.html was not created")
          tables = pd.read_html(report)
          if not tables:
            raise SystemExit("aggregate table missing from official report")
          table = tables[0]
          required = {"controller", "lataccel_cost", "jerk_cost", "total_cost"}
          if set(table.columns) != required or set(table["controller"]) != {"baseline", "test"}:
            raise SystemExit(f"unexpected official aggregate table: {table}")
          rows = {
            str(row["controller"]): {
              "lataccel_cost": float(row["lataccel_cost"]),
              "jerk_cost": float(row["jerk_cost"]),
              "total_cost": float(row["total_cost"]),
            }
            for _, row in table.iterrows()
          }
          if not rows["test"]["total_cost"] < rows["baseline"]["total_cost"]:
            raise SystemExit("V8 did not beat the official PID baseline")
          payload = {
            "scope": "official-5000",
            "num_segments": 5000,
            "controller_version": "V8",
            "test_controller": "riyadh_general",
            "baseline_controller": "pid",
            "aggregate_costs": rows,
            "report_sha256": hashlib.sha256(report.read_bytes()).hexdigest(),
          }
          Path("checkpoints/official5000-v8/summary.json").write_text(
            json.dumps(payload, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
          )
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Archive exact report and submission package
        run: |
          cp official/report.html checkpoints/official5000-v8/report.html
          cp official/controllers/riyadh_general.py checkpoints/official5000-v8/riyadh_general.py
          cp official/models/riyadh_inverse_linear.npz checkpoints/official5000-v8/riyadh_inverse_linear.npz
          sha256sum \
            checkpoints/official5000-v8/report.html \
            checkpoints/official5000-v8/riyadh_general.py \
            checkpoints/official5000-v8/riyadh_inverse_linear.npz \
            > checkpoints/official5000-v8/SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: natural20-v8-official-5000
          path: checkpoints/official5000-v8/
          if-no-files-found: error
          retention-days: 90

      - name: Persist evaluation evidence and terminal state
        if: always()
        run: |
          printf '%s\n' "${{ job.status }}" > checkpoints/official5000-v8/workflow-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f checkpoints/official5000-v8
          git commit -m "results: archive V8 official 5000 ${{ job.status }} [skip ci]"
          git push origin HEAD:controls-challenge-compute

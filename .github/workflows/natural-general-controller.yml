name: Natural-20 General Controller Evaluation

on:
  workflow_dispatch:
  push:
    branches: [controls-challenge-compute]
    paths:
      - compute/riyadh_general.py
      - compute/evaluate_general_policy.py
      - compute/train_warmup_inverse.py
      - compute/train_closed_loop_residual.py
      - compute/package_closed_loop_residual.py
      - compute/compare_general_runs.py
      - compute/select_general_candidate.py
      - compute/select_general_config.py
      - compute/analyze_general_runs.py
      - checkpoints/general/models/v10-closed-loop-conservative.npz
      - checkpoints/general/models/v10-closed-loop-deploy.npz
      - .github/workflows/natural-general-controller.yml

permissions:
  contents: write

concurrency:
  group: natural20-general-controller-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v11-robust-search:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Checkout official challenge
        run: git clone --depth 1 https://github.com/commaai/controls_challenge.git official
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install official runtime
        run: python -m pip install --upgrade pip pandas numpy onnxruntime matplotlib seaborn tqdm
      - name: Download official dataset
        working-directory: official
        run: python -c "from tinyphysics import download_dataset; download_dataset()"
      - name: Train reproducible inverse model
        run: |
          python -u compute/train_warmup_inverse.py \
            --data-dir official/data \
            --train-start 0 --train-count 5000 \
            --validation-start 10000 --validation-count 500 \
            --output official/models/riyadh_inverse_linear.npz
      - name: Run controller tests
        run: python -m unittest discover -s tests -v

      - name: Evaluate V8 baseline on development segments
        run: |
          python -u compute/evaluate_general_policy.py \
            --official-dir official \
            --controller-source compute/riyadh_general.py \
            --disable-model --quiet \
            --unseen-start 16500 --unseen-count 100 \
            --output checkpoints/general/v10-ci-v8-dev.json
      - name: Package and evaluate V10 scale candidates on development only
        run: |
          mkdir -p checkpoints/general/v10-scale-models checkpoints/general/v10-scale-dev
          for scale in 0.25 0.40 0.55 0.70 0.80 1.00; do
            label=${scale/./p}
            python compute/package_closed_loop_residual.py \
              --source checkpoints/general/models/v10-closed-loop-conservative.npz \
              --output checkpoints/general/v10-scale-models/v10-scale-${label}.npz \
              --output-scale ${scale}
            python -u compute/evaluate_general_policy.py \
              --official-dir official \
              --controller-source compute/riyadh_general.py \
              --model checkpoints/general/v10-scale-models/v10-scale-${label}.npz \
              --unseen-start 16500 --unseen-count 100 --quiet \
              --output checkpoints/general/v10-scale-dev/v10-scale-${label}.json
          done
      - name: Freeze best V10 scale
        run: |
          python compute/select_general_candidate.py \
            --baseline checkpoints/general/v10-ci-v8-dev.json \
            --candidate 0.25=checkpoints/general/v10-scale-dev/v10-scale-0p25.json=checkpoints/general/v10-scale-models/v10-scale-0p25.npz \
            --candidate 0.40=checkpoints/general/v10-scale-dev/v10-scale-0p40.json=checkpoints/general/v10-scale-models/v10-scale-0p40.npz \
            --candidate 0.55=checkpoints/general/v10-scale-dev/v10-scale-0p55.json=checkpoints/general/v10-scale-models/v10-scale-0p55.npz \
            --candidate 0.70=checkpoints/general/v10-scale-dev/v10-scale-0p70.json=checkpoints/general/v10-scale-models/v10-scale-0p70.npz \
            --candidate 0.80=checkpoints/general/v10-scale-dev/v10-scale-0p80.json=checkpoints/general/v10-scale-models/v10-scale-0p80.npz \
            --candidate 1.00=checkpoints/general/v10-scale-dev/v10-scale-1p00.json=checkpoints/general/v10-scale-models/v10-scale-1p00.npz \
            --output-model checkpoints/general/models/v10-ci-selected.npz \
            --output-scale checkpoints/general/v10-ci-selected-scale.txt \
            --output-report checkpoints/general/v10-ci-selection-dev.json
          scale=$(cat checkpoints/general/v10-ci-selected-scale.txt)
          label=$(printf '%.2f' "$scale" | tr '.' 'p')
          cp checkpoints/general/v10-scale-dev/v10-scale-${label}.json checkpoints/general/v10-ci-selected-dev.json

      - name: Define V11 causal controller configurations
        run: |
          mkdir -p checkpoints/general/v11-configs checkpoints/general/v11-dev
          python - <<'PY'
          import json
          from pathlib import Path
          configs = {
            "default": {},
            "delta100": {"RIYADH_GENERAL_ACTION_DELTA": "1.0"},
            "delta050": {"RIYADH_GENERAL_ACTION_DELTA": "0.5"},
            "delta025": {"RIYADH_GENERAL_ACTION_DELTA": "0.25"},
            "decay995": {"RIYADH_GENERAL_IDECAY": "0.995", "RIYADH_GENERAL_ILIMIT": "20"},
            "decay980": {"RIYADH_GENERAL_IDECAY": "0.98", "RIYADH_GENERAL_ILIMIT": "10"},
            "inverse040": {"RIYADH_GENERAL_INVERSE_SCALE": "0.40"},
            "inverse060": {"RIYADH_GENERAL_INVERSE_SCALE": "0.60"},
            "preview080": {"RIYADH_GENERAL_KPREVIEW": "0.08"},
            "preview120": {"RIYADH_GENERAL_KPREVIEW": "0.12"},
            "smooth_decay": {"RIYADH_GENERAL_ACTION_DELTA": "0.5", "RIYADH_GENERAL_IDECAY": "0.995", "RIYADH_GENERAL_ILIMIT": "20"},
            "smooth_inverse": {"RIYADH_GENERAL_ACTION_DELTA": "0.5", "RIYADH_GENERAL_INVERSE_SCALE": "0.40"},
            "balanced": {"RIYADH_GENERAL_ACTION_DELTA": "0.5", "RIYADH_GENERAL_IDECAY": "0.995", "RIYADH_GENERAL_ILIMIT": "20", "RIYADH_GENERAL_INVERSE_SCALE": "0.45", "RIYADH_GENERAL_KPREVIEW": "0.08"},
          }
          root = Path("checkpoints/general/v11-configs")
          for name, config in configs.items():
            (root / f"{name}.json").write_text(json.dumps(config, indent=2, sort_keys=True) + "\n")
          PY
      - name: Evaluate V11 configurations on development only
        run: |
          for config in checkpoints/general/v11-configs/*.json; do
            label=$(basename "$config" .json)
            assignments=$(python - "$config" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          print(" ".join(f"{key}={value}" for key, value in sorted(data.items())))
          PY
            )
            env $assignments python -u compute/evaluate_general_policy.py \
              --official-dir official \
              --controller-source compute/riyadh_general.py \
              --model checkpoints/general/models/v10-ci-selected.npz \
              --unseen-start 16500 --unseen-count 100 --quiet \
              --output checkpoints/general/v11-dev/${label}.json
          done
      - name: Freeze best robust V11 configuration
        run: |
          args=""
          for config in checkpoints/general/v11-configs/*.json; do
            label=$(basename "$config" .json)
            args="$args --candidate ${label}=checkpoints/general/v11-dev/${label}.json=${config}"
          done
          python compute/select_general_config.py \
            --baseline checkpoints/general/v10-ci-selected-dev.json \
            $args \
            --output-env checkpoints/general/v11-selected.env \
            --output-report checkpoints/general/v11-selection-dev.json

      - name: Evaluate V8 and frozen V10 on fresh holdout-2
        run: |
          python -u compute/evaluate_general_policy.py \
            --official-dir official \
            --controller-source compute/riyadh_general.py \
            --disable-model --quiet \
            --unseen-start 19500 --unseen-count 100 \
            --output checkpoints/general/v11-v8-holdout2.json
          python -u compute/evaluate_general_policy.py \
            --official-dir official \
            --controller-source compute/riyadh_general.py \
            --model checkpoints/general/models/v10-ci-selected.npz \
            --unseen-start 19500 --unseen-count 100 --quiet \
            --output checkpoints/general/v11-v10-holdout2.json
      - name: Evaluate frozen V11 once on fresh holdout-2
        run: |
          source checkpoints/general/v11-selected.env
          python -u compute/evaluate_general_policy.py \
            --official-dir official \
            --controller-source compute/riyadh_general.py \
            --model checkpoints/general/models/v10-ci-selected.npz \
            --unseen-start 19500 --unseen-count 100 --quiet \
            --output checkpoints/general/v11-candidate-holdout2.json
      - name: Gate V11 against V10 on fresh holdout-2
        run: |
          python compute/compare_general_runs.py \
            --baseline checkpoints/general/v11-v10-holdout2.json \
            --candidate checkpoints/general/v11-candidate-holdout2.json \
            --output checkpoints/general/v11-gate-holdout2.json
      - name: Diagnose V11 results
        if: always()
        run: |
          if [ -f checkpoints/general/v11-v10-holdout2.json ] && [ -f checkpoints/general/v11-candidate-holdout2.json ]; then
            python compute/analyze_general_runs.py \
              --baseline checkpoints/general/v11-v10-holdout2.json \
              --candidate checkpoints/general/v11-candidate-holdout2.json \
              --output checkpoints/general/v11-diagnostics-vs-v10.json
          fi
          if [ -f checkpoints/general/v11-v8-holdout2.json ] && [ -f checkpoints/general/v11-candidate-holdout2.json ]; then
            python compute/analyze_general_runs.py \
              --baseline checkpoints/general/v11-v8-holdout2.json \
              --candidate checkpoints/general/v11-candidate-holdout2.json \
              --output checkpoints/general/v11-diagnostics-vs-v8.json
          fi
      - name: Write durable V11 run summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = {
            "v10_selection_dev": "checkpoints/general/v10-ci-selection-dev.json",
            "v11_selection_dev": "checkpoints/general/v11-selection-dev.json",
            "v11_gate_holdout2": "checkpoints/general/v11-gate-holdout2.json",
            "v11_diagnostics_vs_v10": "checkpoints/general/v11-diagnostics-vs-v10.json",
            "v11_diagnostics_vs_v8": "checkpoints/general/v11-diagnostics-vs-v8.json",
          }
          payload = {
            "commit": "${{ github.sha }}",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_attempt": "${{ github.run_attempt }}",
            "research_basis": [
              "causal temporal memory",
              "conservative residual control",
              "development-only configuration selection",
              "fresh untouched holdout-2 promotion gate",
            ],
          }
          for name, path in paths.items():
            file = Path(path)
            payload[name] = json.loads(file.read_text()) if file.exists() else None
          env_file = Path("checkpoints/general/v11-selected.env")
          payload["selected_environment"] = env_file.read_text().splitlines() if env_file.exists() else None
          output = Path("checkpoints/general/v11-run-summary.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
      - name: Publish latest durable V11 summary to branch
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p results
          cp checkpoints/general/v11-run-summary.json results/latest-v11-summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/latest-v11-summary.json
          if git diff --cached --quiet; then
            echo "No summary change to publish"
          else
            git commit -m "Record latest V11 robustness summary [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: natural20-general-controller-v11-robust-search
          path: |
            checkpoints/general/v10-ci-selection-dev.json
            checkpoints/general/models/v10-ci-selected.npz
            checkpoints/general/v11-configs/*.json
            checkpoints/general/v11-dev/*.json
            checkpoints/general/v11-selected.env
            checkpoints/general/v11-selection-dev.json
            checkpoints/general/v11-v8-holdout2.json
            checkpoints/general/v11-v10-holdout2.json
            checkpoints/general/v11-candidate-holdout2.json
            checkpoints/general/v11-gate-holdout2.json
            checkpoints/general/v11-diagnostics-vs-v10.json
            checkpoints/general/v11-diagnostics-vs-v8.json
            checkpoints/general/v11-run-summary.json
            official/models/riyadh_inverse_linear.npz
            official/models/riyadh_inverse_linear.json
          if-no-files-found: warn

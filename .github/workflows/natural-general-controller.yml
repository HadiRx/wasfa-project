name: Natural-20 General Controller Evaluation
on:
  workflow_dispatch:
  push:
    branches: [controls-challenge-compute]
    paths:
      - compute/riyadh_v13_cma.py
      - compute/optimize_v13_cma.py
      - compute/evaluate_general_policy.py
      - compute/train_warmup_inverse.py
      - compute/package_closed_loop_residual.py
      - compute/compare_general_runs.py
      - compute/select_general_candidate.py
      - compute/analyze_general_runs.py
      - checkpoints/general/models/v10-closed-loop-conservative.npz
      - .github/workflows/natural-general-controller.yml
permissions:
  contents: write
concurrency:
  group: natural20-general-controller-${{ github.ref }}
  cancel-in-progress: true
jobs:
  v13-cma-direct-search:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Checkout official challenge
        run: git clone --depth 1 https://github.com/commaai/controls_challenge.git official
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: python -m pip install --upgrade pip pandas numpy onnxruntime matplotlib seaborn tqdm cmaes
      - name: Download official dataset
        working-directory: official
        run: python -c "from tinyphysics import download_dataset; download_dataset()"
      - name: Validate V13 splits
        run: |
          python - <<'PY'
          from pathlib import Path
          ranges={'inverse_train':(0,5000),'inverse_validation':(10000,500),'v10_dev':(16500,100),'v13_search':(13500,48),'v13_dev':(14000,100),'v13_holdout':(14500,100)}
          missing=[]
          for name,(start,count) in ranges.items():
            absent=[str(Path('official/data')/f'{i:05d}.csv') for i in range(start,start+count) if not (Path('official/data')/f'{i:05d}.csv').exists()]
            print(name,start,count,len(absent));missing+=absent[:10]
          if missing: raise SystemExit('Missing files: '+', '.join(missing))
          PY
      - name: Train inverse model
        run: |
          python -u compute/train_warmup_inverse.py --data-dir official/data --train-start 0 --train-count 5000 --validation-start 10000 --validation-count 500 --output official/models/riyadh_inverse_linear.npz
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce frozen V10
        run: |
          mkdir -p checkpoints/general/v10-scale-models checkpoints/general/v10-scale-dev checkpoints/general/models
          python -u compute/evaluate_general_policy.py --official-dir official --controller-source compute/riyadh_v13_cma.py --disable-model --quiet --unseen-start 16500 --unseen-count 100 --output checkpoints/general/v10-v8-dev.json
          for scale in 0.25 0.40 0.55 0.70 0.80 1.00; do
            label=${scale/./p}
            python compute/package_closed_loop_residual.py --source checkpoints/general/models/v10-closed-loop-conservative.npz --output checkpoints/general/v10-scale-models/v10-scale-${label}.npz --output-scale ${scale}
            python -u compute/evaluate_general_policy.py --official-dir official --controller-source compute/riyadh_v13_cma.py --model checkpoints/general/v10-scale-models/v10-scale-${label}.npz --unseen-start 16500 --unseen-count 100 --quiet --output checkpoints/general/v10-scale-dev/v10-scale-${label}.json
          done
          python compute/select_general_candidate.py --baseline checkpoints/general/v10-v8-dev.json --candidate 0.25=checkpoints/general/v10-scale-dev/v10-scale-0p25.json=checkpoints/general/v10-scale-models/v10-scale-0p25.npz --candidate 0.40=checkpoints/general/v10-scale-dev/v10-scale-0p40.json=checkpoints/general/v10-scale-models/v10-scale-0p40.npz --candidate 0.55=checkpoints/general/v10-scale-dev/v10-scale-0p55.json=checkpoints/general/v10-scale-models/v10-scale-0p55.npz --candidate 0.70=checkpoints/general/v10-scale-dev/v10-scale-0p70.json=checkpoints/general/v10-scale-models/v10-scale-0p70.npz --candidate 0.80=checkpoints/general/v10-scale-dev/v10-scale-0p80.json=checkpoints/general/v10-scale-models/v10-scale-0p80.npz --candidate 1.00=checkpoints/general/v10-scale-dev/v10-scale-1p00.json=checkpoints/general/v10-scale-models/v10-scale-1p00.npz --output-model checkpoints/general/models/v10-selected.npz --output-scale checkpoints/general/v10-selected-scale.txt --output-report checkpoints/general/v10-selection.json
      - name: Run V13-A CMA-ES search
        run: |
          python -u compute/optimize_v13_cma.py --official-dir official --controller-source compute/riyadh_v13_cma.py --inverse-model official/models/riyadh_inverse_linear.npz --baseline-model checkpoints/general/models/v10-selected.npz --start 13500 --count 48 --batch 12 --population 10 --generations 12 --finalists 5 --output-model checkpoints/general/models/v13-cma.npz --output-report checkpoints/general/v13-cma-search.json
      - name: Evaluate V10 and V13 on development
        run: |
          python -u compute/evaluate_general_policy.py --official-dir official --controller-source compute/riyadh_v13_cma.py --model checkpoints/general/models/v10-selected.npz --unseen-start 14000 --unseen-count 100 --quiet --output checkpoints/general/v13-v10-dev.json
          python -u compute/evaluate_general_policy.py --official-dir official --controller-source compute/riyadh_v13_cma.py --model checkpoints/general/models/v13-cma.npz --unseen-start 14000 --unseen-count 100 --quiet --output checkpoints/general/v13-candidate-dev.json
          python compute/compare_general_runs.py --baseline checkpoints/general/v13-v10-dev.json --candidate checkpoints/general/v13-candidate-dev.json --output checkpoints/general/v13-gate-dev.json || true
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          passed=bool(json.loads(Path('checkpoints/general/v13-gate-dev.json').read_text()).get('passed'))
          shutil.copy2('checkpoints/general/models/v13-cma.npz' if passed else 'checkpoints/general/models/v10-selected.npz','checkpoints/general/models/v13-selected.npz')
          Path('checkpoints/general/v13-selected-label.txt').write_text('v13-cma\n' if passed else 'v10-fallback\n')
          PY
      - name: Evaluate frozen candidate on holdout
        run: |
          python -u compute/evaluate_general_policy.py --official-dir official --controller-source compute/riyadh_v13_cma.py --model checkpoints/general/models/v10-selected.npz --unseen-start 14500 --unseen-count 100 --quiet --output checkpoints/general/v13-v10-holdout.json
          python -u compute/evaluate_general_policy.py --official-dir official --controller-source compute/riyadh_v13_cma.py --model checkpoints/general/models/v13-selected.npz --unseen-start 14500 --unseen-count 100 --quiet --output checkpoints/general/v13-selected-holdout.json
          python compute/compare_general_runs.py --baseline checkpoints/general/v13-v10-holdout.json --candidate checkpoints/general/v13-selected-holdout.json --output checkpoints/general/v13-gate-holdout.json || true
          python compute/analyze_general_runs.py --baseline checkpoints/general/v13-v10-holdout.json --candidate checkpoints/general/v13-selected-holdout.json --output checkpoints/general/v13-diagnostics-holdout.json
      - name: Write and publish V13 summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files={'v10_selection':'checkpoints/general/v10-selection.json','search':'checkpoints/general/v13-cma-search.json','gate_dev':'checkpoints/general/v13-gate-dev.json','gate_holdout':'checkpoints/general/v13-gate-holdout.json','diagnostics':'checkpoints/general/v13-diagnostics-holdout.json'}
          p={'commit':'${{ github.sha }}','workflow_run_id':'${{ github.run_id }}','selected_label':Path('checkpoints/general/v13-selected-label.txt').read_text().strip() if Path('checkpoints/general/v13-selected-label.txt').exists() else None}
          for k,v in files.items(): p[k]=json.loads(Path(v).read_text()) if Path(v).exists() else None
          Path('checkpoints/general/v13-run-summary.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          cp checkpoints/general/v13-run-summary.json /tmp/latest-v13-summary.json
          git fetch origin controls-challenge-compute
          git checkout -B controls-challenge-compute origin/controls-challenge-compute
          mkdir -p results
          cp /tmp/latest-v13-summary.json results/latest-v13-summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions-bot@users.noreply.github.com"
          git add results/latest-v13-summary.json
          if git diff --cached --quiet; then
            echo "No V13 summary change"
          else
            git commit -m "Record latest V13 CMA summary [skip ci]"
            git push origin HEAD:controls-challenge-compute
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: natural20-v13-cma-direct-search
          path: |
            checkpoints/general/v10-selection.json
            checkpoints/general/models/v10-selected.npz
            checkpoints/general/models/v13-cma.npz
            checkpoints/general/models/v13-selected.npz
            checkpoints/general/v13-selected-label.txt
            checkpoints/general/v13-cma-search.json
            checkpoints/general/v13-gate-dev.json
            checkpoints/general/v13-gate-holdout.json
            checkpoints/general/v13-diagnostics-holdout.json
            checkpoints/general/v13-run-summary.json
            official/models/riyadh_inverse_linear.npz
            official/models/riyadh_inverse_linear.json
          if-no-files-found: warn

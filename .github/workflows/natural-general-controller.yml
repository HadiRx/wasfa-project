name: Natural-20 General Controller Evaluation

on:
  workflow_dispatch:
  push:
    branches: [controls-challenge-compute]
    paths:
      - compute/riyadh_general.py
      - compute/evaluate_general_policy.py
      - compute/train_warmup_inverse.py
      - compute/train_v12_mlp_residual.py
      - compute/package_closed_loop_residual.py
      - compute/compare_general_runs.py
      - compute/select_general_candidate.py
      - compute/analyze_general_runs.py
      - checkpoints/general/models/v10-closed-loop-conservative.npz
      - .github/workflows/natural-general-controller.yml

permissions:
  contents: write

concurrency:
  group: natural20-general-controller-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v12-nonlinear-residual:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Checkout official challenge
        run: git clone --depth 1 https://github.com/commaai/controls_challenge.git official
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install official runtime
        run: python -m pip install --upgrade pip pandas numpy onnxruntime matplotlib seaborn tqdm
      - name: Download official dataset
        working-directory: official
        run: python -c "from tinyphysics import download_dataset; download_dataset()"

      - name: Validate selected data splits
        run: |
          python - <<'PY'
          from pathlib import Path
          ranges = {
            'inverse_train': (0, 5000),
            'inverse_validation': (10000, 500),
            'v10_development': (16500, 100),
            'v12_train': (12000, 200),
            'v12_validation': (12300, 50),
            'v12_development3': (12500, 100),
            'v12_holdout3': (13000, 100),
          }
          root = Path('official/data')
          missing = []
          for name, (start, count) in ranges.items():
            paths = [root / f'{idx:05d}.csv' for idx in range(start, start + count)]
            absent = [str(path) for path in paths if not path.exists()]
            print(f'{name}: start={start} count={count} missing={len(absent)}')
            missing.extend(absent[:10])
          if missing:
            raise SystemExit('Missing selected dataset files: ' + ', '.join(missing))
          PY

      - name: Train reproducible inverse model
        run: |
          python -u compute/train_warmup_inverse.py \
            --data-dir official/data \
            --train-start 0 --train-count 5000 \
            --validation-start 10000 --validation-count 500 \
            --output official/models/riyadh_inverse_linear.npz

      - name: Run controller tests
        run: python -m unittest discover -s tests -v

      - name: Evaluate V8 baseline on development
        run: |
          python -u compute/evaluate_general_policy.py \
            --official-dir official \
            --controller-source compute/riyadh_general.py \
            --disable-model --quiet \
            --unseen-start 16500 --unseen-count 100 \
            --output checkpoints/general/v10-ci-v8-dev.json

      - name: Reproduce and freeze best V10 scale
        run: |
          mkdir -p checkpoints/general/v10-scale-models checkpoints/general/v10-scale-dev checkpoints/general/models
          for scale in 0.25 0.40 0.55 0.70 0.80 1.00; do
            label=${scale/./p}
            python compute/package_closed_loop_residual.py \
              --source checkpoints/general/models/v10-closed-loop-conservative.npz \
              --output checkpoints/general/v10-scale-models/v10-scale-${label}.npz \
              --output-scale ${scale}
            python -u compute/evaluate_general_policy.py \
              --official-dir official \
              --controller-source compute/riyadh_general.py \
              --model checkpoints/general/v10-scale-models/v10-scale-${label}.npz \
              --unseen-start 16500 --unseen-count 100 --quiet \
              --output checkpoints/general/v10-scale-dev/v10-scale-${label}.json
          done
          python compute/select_general_candidate.py \
            --baseline checkpoints/general/v10-ci-v8-dev.json \
            --candidate 0.25=checkpoints/general/v10-scale-dev/v10-scale-0p25.json=checkpoints/general/v10-scale-models/v10-scale-0p25.npz \
            --candidate 0.40=checkpoints/general/v10-scale-dev/v10-scale-0p40.json=checkpoints/general/v10-scale-models/v10-scale-0p40.npz \
            --candidate 0.55=checkpoints/general/v10-scale-dev/v10-scale-0p55.json=checkpoints/general/v10-scale-models/v10-scale-0p55.npz \
            --candidate 0.70=checkpoints/general/v10-scale-dev/v10-scale-0p70.json=checkpoints/general/v10-scale-models/v10-scale-0p70.npz \
            --candidate 0.80=checkpoints/general/v10-scale-dev/v10-scale-0p80.json=checkpoints/general/v10-scale-models/v10-scale-0p80.npz \
            --candidate 1.00=checkpoints/general/v10-scale-dev/v10-scale-1p00.json=checkpoints/general/v10-scale-models/v10-scale-1p00.npz \
            --output-model checkpoints/general/models/v10-ci-selected.npz \
            --output-scale checkpoints/general/v10-ci-selected-scale.txt \
            --output-report checkpoints/general/v10-ci-selection-dev.json

      - name: Train V12 Karpathy-style compact MLP residual
        run: |
          python -u compute/train_v12_mlp_residual.py \
            --official-dir official \
            --controller-source compute/riyadh_general.py \
            --inverse-model official/models/riyadh_inverse_linear.npz \
            --train-start 12000 --train-count 200 \
            --validation-start 12300 --validation-count 50 \
            --hidden1 32 --hidden2 16 \
            --epochs 24 --batch-size 2048 \
            --learning-rate 0.002 --weight-decay 0.0001 \
            --gradient-clip 1.0 \
            --residual-limit 0.15 --output-scale 0.50 \
            --output checkpoints/general/models/v12-mlp-residual.npz

      - name: Evaluate V10 and V12 on development-3
        run: |
          python -u compute/evaluate_general_policy.py \
            --official-dir official \
            --controller-source compute/riyadh_general.py \
            --model checkpoints/general/models/v10-ci-selected.npz \
            --unseen-start 12500 --unseen-count 100 --quiet \
            --output checkpoints/general/v12-v10-dev3.json
          python -u compute/evaluate_general_policy.py \
            --official-dir official \
            --controller-source compute/riyadh_general.py \
            --model checkpoints/general/models/v12-mlp-residual.npz \
            --unseen-start 12500 --unseen-count 100 --quiet \
            --output checkpoints/general/v12-candidate-dev3.json

      - name: Gate and freeze V12 on development-3
        run: |
          python compute/compare_general_runs.py \
            --baseline checkpoints/general/v12-v10-dev3.json \
            --candidate checkpoints/general/v12-candidate-dev3.json \
            --output checkpoints/general/v12-gate-dev3.json || true
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          report = json.loads(Path('checkpoints/general/v12-gate-dev3.json').read_text())
          passed = bool(report.get('passed'))
          source = Path('checkpoints/general/models/v12-mlp-residual.npz' if passed else 'checkpoints/general/models/v10-ci-selected.npz')
          target = Path('checkpoints/general/models/v12-selected.npz')
          shutil.copy2(source, target)
          Path('checkpoints/general/v12-selected-label.txt').write_text('v12-mlp\n' if passed else 'v10-fallback\n')
          print({'selected': 'v12-mlp' if passed else 'v10-fallback', 'development_gate_passed': passed})
          PY

      - name: Evaluate frozen candidates on fresh holdout-3
        run: |
          python -u compute/evaluate_general_policy.py \
            --official-dir official \
            --controller-source compute/riyadh_general.py \
            --model checkpoints/general/models/v10-ci-selected.npz \
            --unseen-start 13000 --unseen-count 100 --quiet \
            --output checkpoints/general/v12-v10-holdout3.json
          python -u compute/evaluate_general_policy.py \
            --official-dir official \
            --controller-source compute/riyadh_general.py \
            --model checkpoints/general/models/v12-selected.npz \
            --unseen-start 13000 --unseen-count 100 --quiet \
            --output checkpoints/general/v12-selected-holdout3.json

      - name: Gate frozen V12 against V10 on holdout-3
        run: |
          python compute/compare_general_runs.py \
            --baseline checkpoints/general/v12-v10-holdout3.json \
            --candidate checkpoints/general/v12-selected-holdout3.json \
            --output checkpoints/general/v12-gate-holdout3.json || true

      - name: Diagnose V12
        if: always()
        run: |
          if [ -f checkpoints/general/v12-v10-holdout3.json ] && [ -f checkpoints/general/v12-selected-holdout3.json ]; then
            python compute/analyze_general_runs.py \
              --baseline checkpoints/general/v12-v10-holdout3.json \
              --candidate checkpoints/general/v12-selected-holdout3.json \
              --output checkpoints/general/v12-diagnostics-holdout3.json
          fi

      - name: Write durable V12 summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = {
            'v10_selection_dev': 'checkpoints/general/v10-ci-selection-dev.json',
            'v12_training': 'checkpoints/general/models/v12-mlp-residual.json',
            'v12_gate_dev3': 'checkpoints/general/v12-gate-dev3.json',
            'v12_gate_holdout3': 'checkpoints/general/v12-gate-holdout3.json',
            'v12_diagnostics_holdout3': 'checkpoints/general/v12-diagnostics-holdout3.json',
          }
          payload = {
            'commit': '${{ github.sha }}',
            'workflow_run_id': '${{ github.run_id }}',
            'workflow_run_attempt': '${{ github.run_attempt }}',
            'selected_label': Path('checkpoints/general/v12-selected-label.txt').read_text().strip() if Path('checkpoints/general/v12-selected-label.txt').exists() else None,
            'research_basis': [
              'karpathy/micrograd small transparent MLP design',
              'manual vectorized backpropagation and Adam',
              'stable-baselines3-style reproducible baseline comparison',
              'official comma TinyPhysics closed-loop evaluation',
              'development-only promotion and fresh holdout-3',
            ],
          }
          for name, path in paths.items():
            file = Path(path)
            payload[name] = json.loads(file.read_text()) if file.exists() else None
          output = Path('checkpoints/general/v12-run-summary.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY

      - name: Publish latest durable V12 summary
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p results
          cp checkpoints/general/v12-run-summary.json results/latest-v12-summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions-bot@users.noreply.github.com"
          git add results/latest-v12-summary.json
          if git diff --cached --quiet; then
            echo "No summary change to publish"
          else
            git commit -m "Record latest V12 nonlinear residual summary [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: natural20-general-controller-v12-nonlinear-residual
          path: |
            checkpoints/general/v10-ci-selection-dev.json
            checkpoints/general/models/v10-ci-selected.npz
            checkpoints/general/models/v12-mlp-residual.npz
            checkpoints/general/models/v12-mlp-residual.json
            checkpoints/general/models/v12-selected.npz
            checkpoints/general/v12-selected-label.txt
            checkpoints/general/v12-v10-dev3.json
            checkpoints/general/v12-candidate-dev3.json
            checkpoints/general/v12-gate-dev3.json
            checkpoints/general/v12-v10-holdout3.json
            checkpoints/general/v12-selected-holdout3.json
            checkpoints/general/v12-gate-holdout3.json
            checkpoints/general/v12-diagnostics-holdout3.json
            checkpoints/general/v12-run-summary.json
            official/models/riyadh_inverse_linear.npz
            official/models/riyadh_inverse_linear.json
          if-no-files-found: warn

# Billing unlock retry: 2026-07-17
name: Natural-20 CPU Autopilot

on:
  workflow_dispatch:
  push:
    branches:
      - controls-challenge-compute
    paths:
      - checkpoints/00000.npy.b64
      - compute/**
      - .github/workflows/natural-autopilot.yml

concurrency:
  group: natural-20-autopilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refine-segment-zero:
    if: ${{ !contains(github.event.head_commit.message, '[skip compute]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout compute branch
        uses: actions/checkout@v4
        with:
          ref: controls-challenge-compute

      - name: Checkout official challenge
        run: git clone --depth 1 https://github.com/commaai/controls_challenge.git controls_challenge

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CPU runtime
        run: python -m pip install --upgrade pip pandas numpy onnxruntime matplotlib seaborn tqdm

      - name: Prepare official data and verified checkpoint
        run: |
          cp compute/optimize_natural_cem.py controls_challenge/optimize_natural_cem.py
          cp compute/optimize_natural_hybrid.py controls_challenge/optimize_natural_hybrid.py
          cp compute/optimize_natural_coordinate.py controls_challenge/optimize_natural_coordinate.py
          cp compute/natural_colab_worker.py controls_challenge/natural_colab_worker.py
          cp compute/riyadh_pid.py controls_challenge/controllers/riyadh_pid.py
          mkdir -p autopilot/actions
          base64 --decode checkpoints/00000.npy.b64 > autopilot/actions/00000.npy
          cd controls_challenge
          python -c "from tinyphysics import download_dataset; download_dataset()"

      - name: Run protected coordinate refinement
        working-directory: controls_challenge
        run: |
          python -u natural_colab_worker.py             --data_dir data             --model_path models/tinyphysics.onnx             --out_dir ../autopilot/actions             --start 0 --end 1             --time_budget_minutes 340             --provider CPUExecutionProvider             --method coordinate             --coordinate_iterations 8             --coordinate_spacings 20,10,5,2,1             --coordinate_deltas 0.020,0.015,0.010,0.006,0.004             --coordinate_batch_size 256             --refine

      - name: Verify and persist result
        run: |
          base64 -w 0 autopilot/actions/00000.npy > checkpoints/00000.npy.b64
          printf '\n' >> checkpoints/00000.npy.b64
          cp autopilot/actions/progress.jsonl checkpoints/autopilot-progress.jsonl
          git config user.name "Natural-20 Autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add checkpoints/00000.npy.b64 checkpoints/autopilot-progress.jsonl
          if git diff --cached --quiet; then
            echo "No checkpoint change to commit."
          else
            git commit -m "Natural-20 automated refinement [skip compute]"
            git push
          fi

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-20-segment-00000
          path: |
            autopilot/actions/00000.npy
            autopilot/actions/progress.jsonl
          if-no-files-found: warn
